# Models chosen for the act 10 Codex run through OpenRouter; the reviewer differs from the implementer.
# Codex custom agent: https://learn.chatgpt.com/docs/agent-configuration/subagents
# A different model, and a different vendor, from the implementer's
# (openai/gpt-5.3-codex), so it has different blind spots.
# Chosen from https://openrouter.ai/api/v1/models on 2026-10-02: anthropic/claude-sonnet-5.5
# has architecture.input_modalities [text, image, file] and supports the tools
# parameter. The first real run used z-ai/glm-5.3, which has no image input
# ("No endpoints found that support image input") and could not read screenshots.
# It is not an OpenAI model, so the brief file in .agents/review/briefs/ is how
# it learns the PR (Codex sends spawn messages as OpenAI-only encrypted content).
name = "reviewer"
description = "Reviews one pull request against its OpenSpec change and the review rubric, with no memory of writing it."
model = "anthropic/claude-sonnet-5.5"
developer_instructions = """
Read .agents/review/reviewer.md and follow it exactly. It names your inputs,
what to read, what not to read, the output format and how to post the review.
"""
