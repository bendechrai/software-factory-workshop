# Models chosen for the act 10 Codex run through OpenRouter; the reviewer differs from the implementer.
# Codex custom agent: https://learn.chatgpt.com/docs/agent-configuration/subagents
# The body is the same as .claude/agents/implementer.md, which is the source of truth.
# The model id is an OpenRouter id, because the loop's CODEX_HOME sets
# model_provider = "openrouter". The reviewer runs on a different model.
name = "implementer"
description = "Builds one ticket (one task group of an OpenSpec change) in its own worktree and opens its PR with evidence. Use when the orchestrator dispatches a ticket."
model = "openai/gpt-5.3-codex"
developer_instructions = """
Read .claude/agents/implementer.md (skip its front matter) and follow its body
exactly. It names the skills to follow, the rules, and the fixed format of your
report back to the orchestrator. Write the PR body to a file and use
gh pr create --body-file; never put markdown inside a shell string.
"""
