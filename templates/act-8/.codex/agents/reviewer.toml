# Models chosen for the Codex run through OpenRouter; the reviewer differs from the implementer.
# Codex custom agent: https://learn.chatgpt.com/docs/agent-configuration/subagents
# OpenRouter model ids carry the provider prefix; gpt-5.5-codex is not a valid id there.
# The reviewer differs from the implementer (openai/gpt-5.3-codex) and accepts images,
# so it can read screenshots. Same choice as templates/act-10.
name = "reviewer"
description = "Reviews one pull request against its OpenSpec change and the review rubric, with no memory of writing it."
model = "anthropic/claude-sonnet-5.5"
developer_instructions = """
Read .agents/review/reviewer.md and follow it exactly. It names your inputs,
what to read, what not to read, the output format and how to post the review.
"""
